[package]
name = "bitcoin-asmap-quorum"
version = "0.0.1"
edition = "2024"
default-run = "bitcoin-asmap-quorum"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
flate2 = { version = "1.0", features = ["zlib"], default-features = false }
futures = "0.3"
libp2p = { version = "0.53", features = ["tokio", "gossipsub", "mdns", "noise", "tcp", "yamux", "macros"] }
mrt-rs = "1.1.3"
reqwest = { version = "0.10.1", features = ["blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.38", features = ["full"] }
hex = "0.4"
