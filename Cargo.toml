[workspace]
resolver = "3"
members = ["crates/asmap-codec", "crates/bitcoin-asmap-quorum"]
# Deliberately no `default-members`: it would scope bare `cargo test` to the
# quorum crate and silently drop asmap-codec's unit tests from the command a
# developer types by default. `cargo run -- <subcommand>` still resolves to the
# `bitcoin-asmap-quorum` binary without it, because asmap-codec has no binary
# targets and the quorum crate sets `default-run`.

[workspace.package]
version = "0.0.8"
edition = "2024"
homepage = "https://github.com/bitcoincore-dev/bitcoin-asmap-quorum"
repository = "https://github.com/bitcoincore-dev/bitcoin-asmap-quorum"

[workspace.dependencies]
asmap-codec = { path = "crates/asmap-codec", version = "0.0.8" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
