[package]
name = "bitcoin-asmap-quorum"
version = "0.0.1"
edition = "2024"
default-run = "bitcoin-asmap-quorum"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
libp2p = { version = "0.53", features = ["tokio", "gossipsub", "mdns", "noise", "tcp", "yamux", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
anyhow = "1.0"
chrono = "0.4"
