[package]
name = "bitcoin-asmap-quorum"
version = "0.0.6"
edition = "2024"
default-run = "bitcoin-asmap-quorum"

[features]
expensive_tests = []
flaky_tests = []
relay_tests = []
nostr = ["dep:nostr", "dep:nostr-sdk"]
consensus_lifecycle_100_nodes_cli = []
consensus_lifecycle_50_nodes_cli = []
consensus_lifecycle_25_nodes_cli = []
consensus_lifecycle_5_nodes_cli = []
consensus_lifecycle_2_nodes_cli = []
consensus_lifecycle_1_nodes_cli = []
real_ris_download_bottleneck_cli = []
real_ris_download_bottleneck_cli_rrc18_smoke = []

[dependencies]
anyhow = "1.0"
chrono = "0.4"
env_logger = "0.11"
flate2 = { version = "1.0", features = ["zlib"], default-features = false }
futures = "0.3"
hex = "0.4"
libp2p = { version = "0.53", features = ["tokio", "gossipsub", "mdns", "noise", "tcp", "yamux", "macros", "identify", "relay", "dcutr", "quic", "dns"] }
log = "0.4"
mrt-rs = "1.1.3"
nostr = { version = "0.45.1", default-features = false, features = ["std", "os-rng"], optional = true }
nostr-sdk = { version = "0.45.1", default-features = false, features = ["local-relay"], optional = true }
reqwest = { version = "0.10.1", features = ["blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.38", features = ["full"] }
