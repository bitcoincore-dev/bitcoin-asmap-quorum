name: real_ris_download_bottleneck_cli

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ASMAP_DATA_PUSH_TOKEN: ${{ secrets.ASMAP_DATA_PUSH_TOKEN }}
      ASMAP_DATA_PUSH_SSH_KEY: ${{ secrets.ASMAP_DATA_PUSH_SSH_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Rust code
        run: cargo build

      - name: Test real RIS download bottleneck
        run: |
          set -euo pipefail
          cargo test --features real_ris_download_bottleneck_cli real_ris_download_bottleneck_cli -- --exact --nocapture | tee bottleneck.log

      - name: Materialize RIS artifact
        run: |
          set -euo pipefail
          repo_root="${GITHUB_WORKSPACE}"
          utc_time="$(date -u +%Y%m%dT%H%M%SZ)"
          short_sha="${GITHUB_SHA::7}"
          epoch="$(date -u +%s)"
          year="$(date -u +%Y)"
          topic_branch="topic/ris-bottleneck/${utc_time}-${short_sha}-r${GITHUB_RUN_ATTEMPT}"
          final_result="$(mktemp)"
          map_file="$(mktemp)"

          python3 scripts/extract-ris-bottleneck.py bottleneck.log "${final_result}"
          cargo run -- encode --fill "${final_result}" "${map_file}"

          NO_SIGN=1 \
            scripts/_publish_to_data.sh \
            --data-dir "${repo_root}/data" \
            --epoch "${epoch}" \
            --signer sr-gi \
            --map "${map_file}"

          printf 'UTC_TIME=%s\nSHORT_SHA=%s\nRIS_TOPIC_BRANCH=%s\nRIS_YEAR=%s\nRIS_EPOCH=%s\n' \
            "${utc_time}" "${short_sha}" "${topic_branch}" "${year}" "${epoch}" >> "$GITHUB_ENV"

      - name: Commit bottleneck artifact to data submodule
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail

          git -C data config user.name "github-actions[bot]"
          git -C data config user.email "github-actions[bot]@users.noreply.github.com"
          git -C data checkout -B "${RIS_TOPIC_BRANCH}"
          git -C data add \
            "latest_asmap.dat" \
            "${RIS_YEAR}/${RIS_EPOCH}_asmap.dat" \
            "${RIS_YEAR}/${RIS_EPOCH}_asmap_unfilled.dat" \
            "attestations/${RIS_YEAR}/${RIS_EPOCH}/sr-gi/SHA256SUMS"

          if git -C data diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi

          git -C data commit -m "ris-bottleneck: ${UTC_TIME} ${SHORT_SHA} r${GITHUB_RUN_ATTEMPT}"

          if [[ -z "${ASMAP_DATA_PUSH_SSH_KEY}" ]]; then
            echo "ASMAP_DATA_PUSH_SSH_KEY is not set; cannot push to data submodule"
            exit 1
          fi

          ssh_dir="$RUNNER_TEMP/asmap-data-ssh"
          mkdir -p "${ssh_dir}"
          ssh_key="${ssh_dir}/id_ed25519"
          printf '%s\n' "${ASMAP_DATA_PUSH_SSH_KEY}" > "${ssh_key}"
          chmod 600 "${ssh_key}"
          mkdir -p ~/.ssh
          cp "${ssh_key}" ~/.ssh/id_ed25519
          printf '%s\n' \
            'Host github.com' \
            '  IdentityFile ~/.ssh/id_ed25519' \
            '  IdentitiesOnly yes' > ~/.ssh/config
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global --unset-all url.https://github.com/.insteadOf || true
          git -C data config --local --unset-all url.https://github.com/.insteadOf || true
          git -C data remote set-url origin git@github.com:bitcoincore-dev/asmap-data.git

          git -C data push origin "HEAD:refs/heads/${RIS_TOPIC_BRANCH}"
