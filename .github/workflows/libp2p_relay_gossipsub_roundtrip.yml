name: libp2p_relay_gossipsub_roundtrip

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ASMAP_DATA_PUSH_TOKEN: ${{ secrets.ASMAP_DATA_PUSH_TOKEN }}
      ASMAP_DATA_PUSH_SSH_KEY: ${{ secrets.ASMAP_DATA_PUSH_SSH_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Rust code
        run: cargo build

      - name: Run relay gossipsub roundtrip
        run: |
          set -euo pipefail
          cargo test --features relay_tests libp2p_relay_gossipsub_roundtrip -- --nocapture | tee relay.log

      - name: Commit relay artifact to data submodule
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          utc_time="$(date -u +%Y%m%dT%H%M%SZ)"
          short_sha="${GITHUB_SHA::7}"
          topic_branch="topic/libp2p_relay_gossipsub_roundtrip/${utc_time}-${short_sha}-r${GITHUB_RUN_ATTEMPT}"
          artifact_rel="analysis/libp2p_relay_gossipsub_roundtrip/${utc_time}_${short_sha}_r${GITHUB_RUN_ATTEMPT}.log"
          artifact_path="data/${artifact_rel}"

          mkdir -p "data/analysis/libp2p_relay_gossipsub_roundtrip"
          cp relay.log "${artifact_path}"

          git -C data config user.name "github-actions[bot]"
          git -C data config user.email "github-actions[bot]@users.noreply.github.com"
          git -C data checkout -B "${topic_branch}"
          git -C data add "${artifact_rel}"

          if git -C data diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi

          git -C data commit -m "libp2p_relay_gossipsub_roundtrip: ${utc_time} ${short_sha} r${GITHUB_RUN_ATTEMPT}"

          if [[ -z "${ASMAP_DATA_PUSH_SSH_KEY}" ]]; then
            echo "ASMAP_DATA_PUSH_SSH_KEY is not set; cannot push to data submodule"
            exit 1
          fi

          ssh_dir="$RUNNER_TEMP/asmap-data-ssh"
          mkdir -p "${ssh_dir}"
          ssh_key="${ssh_dir}/id_ed25519"
          printf '%s\n' "${ASMAP_DATA_PUSH_SSH_KEY}" > "${ssh_key}"
          chmod 600 "${ssh_key}"
          mkdir -p ~/.ssh
          cp "${ssh_key}" ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<'EOF'
Host github.com
  IdentityFile ~/.ssh/id_ed25519
  IdentitiesOnly yes
EOF
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git -C data remote set-url origin git@github.com:bitcoincore-dev/asmap-data.git

          git -C data push origin "HEAD:refs/heads/${topic_branch}"
