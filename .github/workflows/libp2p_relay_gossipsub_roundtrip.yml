name: libp2p_relay_gossipsub_roundtrip

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ASMAP_DATA_PUSH_TOKEN: ${{ secrets.ASMAP_DATA_PUSH_TOKEN }}
      ASMAP_DATA_PUSH_SSH_KEY: ${{ secrets.ASMAP_DATA_PUSH_SSH_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Rust code
        run: cargo build

      - name: Run relay gossipsub roundtrip
        run: |
          set -euo pipefail
          cargo test --features relay_tests libp2p_relay_gossipsub_roundtrip -- --nocapture | tee relay.log

      - name: Materialize relay artifact
        run: |
          set -euo pipefail
          repo_root="${GITHUB_WORKSPACE}"
          epoch="$(date -u +%s)"
          year="$(date -u +%Y)"
          relay_dir="${repo_root}/data/${year}"
          artifact_base="${epoch}"
          final_result="$(mktemp)"
          filled_tmp="$(mktemp)"
          unfilled_tmp="$(mktemp)"

          python3 scripts/extract-relay-asmap.py relay.log "${final_result}"

          cargo run -- encode --fill "${final_result}" "${filled_tmp}"
          cargo run -- encode "${final_result}" "${unfilled_tmp}"

          mkdir -p "${relay_dir}"
          cp "${filled_tmp}" "${relay_dir}/${artifact_base}_asmap.dat"
          cp "${unfilled_tmp}" "${relay_dir}/${artifact_base}_asmap_unfilled.dat"

          pushd data >/dev/null
          env SIGNER=sr-gi \
            ASMAP_TXT="${final_result}" \
            ENCODED_FILLED="${relay_dir}/${artifact_base}_asmap.dat" \
            ENCODED_UNFILLED="${relay_dir}/${artifact_base}_asmap_unfilled.dat" \
            EPOCH="${epoch}" \
            NO_SIGN=1 \
            ./asmap-attest
          popd >/dev/null

          printf 'UTC_TIME=%s\nSHORT_SHA=%s\nASMAP_EPOCH=%s\nASMAP_YEAR=%s\n' \
            "$(date -u +%Y%m%dT%H%M%SZ)" "${GITHUB_SHA::7}" "${epoch}" "${year}" >> "$GITHUB_ENV"

      - name: Commit relay artifact to data submodule
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          utc_time="${UTC_TIME}"
          short_sha="${SHORT_SHA}"
          artifact_epoch="${ASMAP_EPOCH}"
          artifact_year="${ASMAP_YEAR}"
          topic_branch="topic/relay-gossipsub/${utc_time}-${short_sha}-r${GITHUB_RUN_ATTEMPT}"
          artifact_files=(
            "${artifact_year}/${artifact_epoch}_asmap.dat"
            "${artifact_year}/${artifact_epoch}_asmap_unfilled.dat"
            "attestations/${artifact_year}/${artifact_epoch}/sr-gi/SHA256SUMS"
          )

          git -C data config user.name "github-actions[bot]"
          git -C data config user.email "github-actions[bot]@users.noreply.github.com"
          git -C data checkout -B "${topic_branch}"
          git -C data add "${artifact_files[@]}"

          if git -C data diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi

          git -C data commit -m "relay-gossipsub: ${utc_time} ${short_sha} r${GITHUB_RUN_ATTEMPT}"

          if [[ -z "${ASMAP_DATA_PUSH_SSH_KEY}" ]]; then
            echo "ASMAP_DATA_PUSH_SSH_KEY is not set; cannot push to data submodule"
            exit 1
          fi

          ssh_dir="$RUNNER_TEMP/asmap-data-ssh"
          mkdir -p "${ssh_dir}"
          ssh_key="${ssh_dir}/id_ed25519"
          printf '%s\n' "${ASMAP_DATA_PUSH_SSH_KEY}" > "${ssh_key}"
          chmod 600 "${ssh_key}"
          mkdir -p ~/.ssh
          cp "${ssh_key}" ~/.ssh/id_ed25519
          printf '%s\n' \
            'Host github.com' \
            '  IdentityFile ~/.ssh/id_ed25519' \
            '  IdentitiesOnly yes' > ~/.ssh/config
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global --unset-all url.https://github.com/.insteadOf || true
          git -C data config --local --unset-all url.https://github.com/.insteadOf || true
          git -C data remote set-url origin git@github.com:bitcoincore-dev/asmap-data.git

          git -C data push origin "HEAD:refs/heads/${topic_branch}"
