[package]
name = "bitcoin-asmap-quorum"
version.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
default-run = "bitcoin-asmap-quorum"
description = "Rust CLI for ASMap conversion, diffing, and quorum-based consensus artifacts"

[features]
# Differential tests against the vendored contrib/asmap/asmap.py. Off by
# default so a clone without python3 still passes `cargo test`; with it on, a
# missing or too-old interpreter is a hard failure rather than a silent skip.
# A pure marker feature: the generator it needs (`asmap_codec::testgen`) comes
# from the dev-dependency below, so enabling this never pulls test scaffolding
# into a normal `cargo build` of the library.
python-differential = []
expensive_tests = []
flaky_tests = []
relay_tests = []
nostr = ["dep:nostr", "dep:nostr-sdk"]
consensus_lifecycle_100_nodes_cli = []
consensus_lifecycle_50_nodes_cli = []
consensus_lifecycle_25_nodes_cli = []
consensus_lifecycle_5_nodes_cli = []
consensus_lifecycle_2_nodes_cli = []
consensus_lifecycle_1_nodes_cli = []
real_ris_download_bottleneck_cli = []
real_ris_download_bottleneck_cli_rrc18_smoke = []

[dependencies]
anyhow = "1.0"
asmap-codec = { workspace = true, features = ["serde"] }
chrono = "0.4"
env_logger = "0.11"
flate2 = { version = "1.0", features = ["zlib"], default-features = false }
futures = "0.3"
hex = "0.4"
libp2p = { version = "0.53", features = ["tokio", "gossipsub", "mdns", "noise", "tcp", "yamux", "macros", "identify", "relay", "dcutr", "quic", "dns"] }
log = "0.4"
mrt-rs = "1.1.3"
nostr = { version = "0.45.1", default-features = false, features = ["std", "os-rng"], optional = true }
nostr-sdk = { version = "0.45.1", default-features = false, features = ["local-relay"], optional = true }
reqwest = { version = "0.10.1", features = ["blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.38", features = ["full"] }

[dev-dependencies]
# Test-only view of the codec, with the random-map generator turned on. Kept out
# of `[dependencies]` on purpose: a feature there would ship `testgen` to
# downstream consumers of this crate, which is exactly what asmap-codec's own
# `testgen` feature comment says not to do.
asmap-codec = { workspace = true, features = ["serde", "testgen"] }
